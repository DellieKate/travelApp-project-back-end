name: CI

on: 
  push:
    branches:
      - 'revision4'
  pull_request:
    branches:
      - '**'
  schedule:
    - cron: '19 4  * * 1'
env:
  IS_CI: true
                                             
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    environment: prod
    
    services:
      mongo: 
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # ------------ GIT + NODE ------------ 
      - uses: actions/checkout@v4
        with: 
            fetch-depth: 0
      - run: echo "Running CI"

      - name: Setup Node
        uses: actions/setup-node@v6
        with: 
          node-version: 24

      - name: Install dependencies
        run: npm ci
      
      # ------------ TESTING ------------ 
      - name: Run tests with coverage
        run: npx jest --coverage --coverageReporters json-summary --reporters=default --reporters=jest-junit
        env:
          NODE_ENV: test

      - name: Jest Coverage Comment
        uses: MishaKav/jest-coverage-comment@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          coverage-summary-path: ./coverage/coverage-summary.json
          title: travelApp Jest Coverage Comment
          summary-title: travelApp Summary
          badge-title: Coverage
          text-instead-badge: false
          hide-comment: false
          create-new-comment: false
          hide-summary: false
          remove-links-to-files: false
          remove-links-to-lines: false
          junitxml-path: ./coverage/junit.xml
          junitxml-title: travelApp JUnit Results
          coverage-path: ./coverage.txt
          coverage-title: travelApp Coverage Report
          coverage-path-prefix: src/
          report-only-changed-files: false

      - name: Post Coverage Comment to PR
        uses: MishaKav/jest-coverage-comment@main
        with: 
          junitxml-path: ./coverage/junit/junit.xml
          junitxml-title: Test Results
          coverage-summary-path: ./coverage/coverage-summary.json
      
      # ------------ UPLOAD TEST ARTIFACTS ------------ 
      - name: Upload coverage report artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: coverage-report
          path: ./coverage/

      - name: Upload JUnit Test result artifacts
        uses: actions/upload-artifact@v4
        with: 
          name: junit-results
          path: ./coverage/junit/

  container-build:
    runs-on: ubuntu-latest
    needs: build-and-verify
    steps:
      - uses: actions/checkout@v4
        with: 
            fetch-depth: 0

      # ------------ DOCKER COMPOSE TEST PHASE ------------ 
      - name: Create blank .env file
        run: touch .env

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3  

      - name: Build and start services for verification
        run:  docker compose -f Docker-compose.yaml up -d --build

      - name: Stop Docker services after verification
        run: docker compose -f Docker-compose.yaml down

      