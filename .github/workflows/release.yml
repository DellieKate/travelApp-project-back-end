name: Release and Publish

on: 
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
             
permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: travelapp-backend
  OWNER_LC: ""
  REPO_LC: ""

jobs:
  tag-and-publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'release'
      
    runs-on: ubuntu-latest
    
    outputs:
      IMAGE_TAG: ${{ steps.set_image.outputs.image_tag }}
      GHCR_IMAGE: ${{ steps.set_image.outputs.ghcr_image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: 
            fetch-depth: 0

      - name: Setup Docker
        uses: docker/setup-buildx-action@v3  
      
      # ------------ LOWERCASE FOR DOCKER TAGS ------------ 
      - name: Set lowercase repository name
        run: |
          echo "OWNER_LC=${OWNER,,}" >> $GITHUB_ENV
          echo "REPO_LC=${REPO,,}" >> $GITHUB_ENV
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}

      # ------------ VERSION TAGGING ------------ 
      - name: Bump version and push tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: "travelApp-v"
          release_branches: release
          default_bump: patch
          dry_run: false
      
      # ------------ SET IMAGE VARIABLES ------------ 
      - name: Set image variables
        id: set_image
        run: |
          IMAGE_TAG="${{ steps.tag_version.outputs.new_tag }}"
          OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"

          GHCR_IMAGE="ghcr.io/${OWNER_LC}/travelapp-backend:${IMAGE_TAG}"
          GHCR_LATEST="ghcr.io/${OWNER_LC}/travelapp-backend:latest"

          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "ghcr_image=$GHCR_IMAGE" >> $GITHUB_OUTPUT
          echo "ghcr_latest=$GHCR_LATEST" >> $GITHUB_OUTPUT

      # ------------ LOGIN TO GHCR ------------ 
      - name: Login to Docker Hub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ------------ BUILDX PRODUCTION IMAGE ------------ 
      - name: Build and push production image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64, linux/arm64
          push: true
          tags: |
            ${{ steps.set_image.outputs.ghcr_image }}
            ${{ steps.set_image.outputs.ghcr_latest }} 
            
      # ------------ CREATE GITHUB RELEASE ------------ 
      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}